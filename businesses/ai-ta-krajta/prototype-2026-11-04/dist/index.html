function details(){return `<details><summary>Redakční pravidla</summary><div class="detail-body">Placená spolupráce je jasně označená. Partner si nekupuje pozitivní hodnocení. Téma, hosté, otázky i finální zpracování zůstávají na redakci. Reportujeme skutečné výsledky; leady ani zhlédnutí negarantujeme.</div></details><details><summary>Další možnosti spolupráce</summary><div class="detail-body">Jednorázová epizoda za 12 000 Kč bez DPH. Tematická spolupráce od 40 000 Kč bez DPH. Přesný rozsah potvrdíme podle zadání. Hlavní nabídkou zůstává dlouhodobé partnerství.</div></details><details><summary>Tip na hosta nebo téma</summary><div class="detail-body">Napište, co člověk skutečně staví nebo zkoumá a co si posluchači odnesou. Přidejte zdroj či ukázku práce. Hosta a téma vybírá redakce. <a href="${BASE}/media-kit?collaboration=host#kontakt" target="_blank" rel="noreferrer" style="text-decoration:underline">Otevřít současný redakční formulář ↗</a></div></details><details id="podklady"><summary>Logo a podklady ke stažení</summary><div class="detail-body"><div class="actions"><a class="btn secondary" href="${BASE}/logo.svg" target="_blank" rel="noreferrer">Logo SVG ↗</a><a class="btn secondary" href="${COVER}" target="_blank" rel="noreferrer">Obal podcastu ↗</a></div><p style="margin-top:15px">Píšeme „AI ta Krajta“. Logo zachovejte bez změn proporcí a barev.</p></div></details>`}
function standardForm(){return `<form class="partner-form"><div class="form-grid"><label class="field">Jméno<input name="name" autocomplete="name" required placeholder="Jak se jmenujete"></label><label class="field">Pracovní e-mail<input name="email" type="email" autocomplete="email" required placeholder="vy@firma.cz"></label><label class="field span2">Firma<input name="company" autocomplete="organization" required placeholder="Vaše firma"></label><label class="field span2">Co chcete společně otevřít?<textarea name="message" required placeholder="Téma, cíl spolupráce a ideální termín."></textarea></label><div class="span2"><button class="btn primary full" type="submit">Probrat tříměsíční partnerství <span class="arrow">↗</span></button></div></div><p class="form-note">Ukázka formuláře — nic se neodesílá. Vyplnění nepředstavuje objednávku.</p><div class="form-result" role="status"></div></form>`}

function homeB(){return `<main id="main" class="wrap"><div class="b-topline"><span><i class="live-dot"></i> Český podcast o AI</span><span>Nové díly každý týden</span></div><div class="b-grid"><div class="b-content"><section class="b-stage"><div><span class="tag"><span class="dot"></span> AI Z KAŽDODENNÍ PRAXE</span><h1>AI se děje.<br>My jsme u toho.</h1><p class="lead">Co nové modely opravdu umí. Co selhává. A co s tím dělají lidé, kteří AI používají každý den.</p><div class="actions">${playButton('Pustit poslední díl','coral')}${navLink('episodes','Archiv ↗','btn secondary')}</div></div><img class="hero-cover" src="${COVER}" alt="Obal AI ta Krajta"></section><section class="b-feed"><div class="b-feed-head"><h2>Právě ve sluchátkách</h2>${navLink('episodes','Všechny díly ↗','text-link')}</div>${episodeRows(latest,'studio')}${platforms()}</section><section class="b-team"><span class="eyebrow">U mikrofonu</span>${team()}</section></div>${rail()}</div></main>`}
function homeC(){return `<main id="main"><div class="wrap"><section class="c-hero"><span class="eyebrow"><span class="live-dot"></span> AI ta Krajta × vaše značka</span><h1>Buďte součástí<br><em>debaty o AI.</em></h1><div class="c-hero-bottom"><p class="lead">Dlouhodobé partnerství s českým podcastem, který se ptá, zkouší a jde do hloubky. Pro firmy s opravdovým tématem.</p><div class="c-price-inline">${price()}</div></div><div class="c-action-line">${partnerButton('Chci být hlavním partnerem')}${navLink('episodes','Jdu raději poslouchat ↗','text-link')}</div></section><section class="c-podcast-dock"><img src="${COVER}" alt="Obal AI ta Krajta"><div><span class="cover-label">PUSŤTE SI, JAK ZNÍME</span><h3>Nová éra VZP — skok do hackathonů a digitalizace</h3></div><div class="actions">${playButton('Pustit díl #70','white')}${navLink('episodes','Všechny díly ↗','text-link')}</div></section><section class="c-explain"><div><span class="eyebrow">Partnerství, které má obsah</span><h2 style="margin-top:18px">Značka je vidět.<br>Debata zůstává naše.</h2></div><div><div class="c-benefit"><span class="ordinal">01</span><div><h3>Pravidelná přítomnost</h3><p>Čtyři nativní integrace během 30 dní. Minimálně tři měsíce pro souvislou spolupráci.</p></div></div><div class="c-benefit"><span class="ordinal">02</span><div><h3>Obsah a distribuce</h3><p>Prioritní logo a odkaz, LinkedIn distribuce a redakčně nezávislé zpracování.</p></div></div><div class="c-benefit"><span class="ordinal">03</span><div><h3>Výsledky na stole</h3><p>UTM měření, reporty po 7 a 30 dnech a společné vyhodnocení.</p></div></div></div></section></div><section class="c-latest"><div class="wrap"><div class="section-head"><h2>Poslední díly</h2>${navLink('episodes','Celý archiv ↗','text-link')}</div>${episodeRows(latest)}</div></section><section class="wrap c-team"><span class="eyebrow">Podcast připravují</span>${team()}</section></main>`}
function partnersA(){return `<main id="main" class="wrap"><section class="page-intro"><span class="eyebrow">Dlouhodobé partnerství</span><h1 style="margin-top:18px">Dobré téma si zaslouží<br>víc než jeden díl.</h1><p class="lead">Staňte se hlavním partnerem AI ta Krajta. Propojíme vaši značku s pravidelnou, otevřenou debatou o AI.</p></section><div class="a-partner-grid"><section><div class="a-partner-price"><span class="eyebrow">Hlavní partner pořadu</span>${price()}${offerList()}${contactButton()}</div><h2>Co si skutečně domlouváme.</h2><p class="lead" style="font-size:14px;margin-top:20px">Pravidelnou přítomnost, konkrétní plnění a měření. Obsah má být užitečný posluchačům a srozumitelný vašemu cíli — od technické důvěryhodnosti po představení týmu.</p><p class="a-quote">Partnerství ano.<br>Koupený názor ne.</p>${proof()}<div style="margin-top:35px">${details()}</div></section><aside class="contact-panel" id="kontakt"><span class="eyebrow">První krok</span><h3 style="font-family:Georgia,serif;font-weight:normal;margin-top:14px">Pojďme probrat vaše téma.</h3><p>Napište, čeho chcete dosáhnout. Společně si potvrdíme rozsah, termín i redakční hranice.</p>${standardForm()}</aside></div></main>`}
function partnersB(){return `<main id="main" class="wrap"><section class="b-partner-hero"><div><span class="eyebrow">Hlavní partner AI ta Krajta</span><h1>Vaše značka.<br>Pravidelně u mikrofonu.</h1><p class="lead">Tři měsíce spolupráce s jasným obsahem, distribucí a vyhodnocením. V podcastu, který se o AI baví z vlastní zkušenosti.</p><div class="actions" style="margin-top:30px">${contactButton('Domluvit partnerství','coral')}</div>${proof()}</div>${rail('Jedno partnerství. Jasný rozsah.','Probrat můj záměr')}</section><section class="b-delivery"><div><span class="eyebrow">Jak spolupráce poběží</span><h2 style="margin-top:16px">Méně domněnek.<br>Konkrétní dohoda.</h2><p class="lead" style="font-size:13px;margin-top:20px">Nejdřív si řekneme cíl. Potom připravíme formát a potvrdíme, co, kdy a jak budeme vyhodnocovat.</p></div><div class="b-timeline"><div class="step"><span>01 / PŘÍPRAVA</span><h3>Cíl, téma a plán</h3><p>Domluvíme rozsah, označení spolupráce a redakční pravidla.</p></div><div class="step"><span>02 / KAŽDÝCH 30 DNÍ</span><h3>Čtyři nativní integrace</h3><p>Průběžná přítomnost značky, logo a odkaz, LinkedIn distribuce.</p></div><div class="step"><span>03 / VYHODNOCENÍ</span><h3>Report po 7 a 30 dnech</h3><p>UTM měření, skutečné výsledky a společná debata o dalším období.</p></div></div></section><section class="b-contact" id="kontakt"><div><span class="eyebrow">Pojďme se poznat</span><h2 style="margin-top:16px">Co chcete<br>v AI otevřít?</h2><p class="lead" style="font-size:14px;margin-top:20px">Oslovení není objednávka. Nejdřív probereme, jestli si téma a publikum sednou.</p></div><div class="contact-panel">${standardForm()}</div></section><section style="padding-bottom:40px">${details()}</section></main>`}
function brief(){let content;if(briefStep===0){content=`<h3>Čeho chcete dosáhnout?</h3><p>Vyberte nejbližší cíl. Rozsah partnerství se tím nemění.</p><div class="choice-grid">${['Technická důvěryhodnost','Nábor a tým','Produkt nebo event','Vlastní téma'].map(goal=>`<button class="choice ${briefGoal===goal?'selected':''}" data-goal="${esc(goal)}" aria-pressed="${briefGoal===goal}">${goal}</button>`).join('')}</div><div class="brief-controls"><button class="btn primary" data-brief-next>Pokračovat <span class="arrow">→</span></button></div>`}else if(briefStep===1){content=`<h3>Jaké téma máte na mysli?</h3><p>Stačí pár vět. Která zkušenost nebo problém by naše posluchače mohl zajímat?</p><label class="field">Vaše téma<textarea id="brief-topic" placeholder="Co u vás s AI řešíte a proč o tom mluvit…">${esc(briefTopic)}</textarea></label><div class="brief-controls"><button class="btn secondary" data-brief-back>← Zpět</button><button class="btn primary" data-brief-next>Kontakt <span class="arrow">→</span></button></div>`}else{content=`<h3>Na koho se můžeme obrátit?</h3><p>Potvrdíme si vhodnost tématu, rozsah i termín. Nic tím neobjednáváte.</p><div class="c-recap"><strong>Hlavní partnerství · nejméně 3 měsíce</strong><br>Od 39 000 Kč měsíčně bez DPH, celkem od 117 000 Kč bez DPH.<br>Cíl: ${esc(briefGoal)}</div><form class="partner-form"><div class="form-grid"><label class="field">Jméno<input name="name" required autocomplete="name" placeholder="Vaše jméno" value="${esc(briefContact.name||'')}"></label><label class="field">Pracovní e-mail<input name="email" required type="email" autocomplete="email" placeholder="vy@firma.cz" value="${esc(briefContact.email||'')}"></label><label class="field span2">Firma<input name="company" required autocomplete="organization" placeholder="Vaše firma" value="${esc(briefContact.company||'')}"></label></div><div class="brief-controls"><button type="button" class="btn secondary" data-brief-back>← Zpět</button><button type="submit" class="btn primary">Probrat partnerství ↗</button></div><p class="form-note">Ukázka formuláře — nic se neodesílá.</p><div class="form-result" role="status"></div></form>`}return `<div class="brief-tabs" aria-label="Kroky nezávazné poptávky">${['Cíl','Téma','Kontakt'].map((label,i)=>`<button data-brief-step="${i}" ${briefStep===i?'aria-current="step"':''}>${i+1}. ${label}</button>`).join('')}</div><div class="brief-step">${content}</div>`}
function partnersC(){return `<main id="main" class="wrap"><section class="c-partner-heading"><div><span class="eyebrow">Partnerství pro smysluplná témata</span><h1>Tři měsíce.<br>Jedno dobré téma.</h1><p class="lead">Buďte hlavním partnerem AI ta Krajta. Dejte značce pravidelné místo v debatě, která má co říct.</p></div><aside class="c-partner-offer"><span class="eyebrow">Hlavní partner pořadu</span>${price()}</aside></section><div class="c-brief-layout"><section class="brief-context"><span class="eyebrow">Co je v partnerství</span>${offerList()}<h3 style="margin:35px 0 15px">Názor si nekupujete.</h3><p class="lead" style="font-size:13px">Plnění je konkrétní, debata zůstává redakčně nezávislá. Placená spolupráce je vždy označená.</p>${proof()}${details()}</section><section class="contact-panel" id="kontakt"><span class="eyebrow" style="margin-bottom:22px">Stručný brief místo dlouhého formuláře</span><div id="brief-content">${brief()}</div></section></div></main>`}
function searchControls(){return `<div class="search-row"><input id="archive-search" type="search" aria-label="Hledat v dílech" placeholder="Hledat téma nebo jméno" value="${esc(search)}"><select id="person-filter" aria-label="Filtrovat podle člověka"><option value="">Všichni lidé</option>${people.map(([id,name])=>`<option value="${id}" ${id===personFilter?'selected':''}>${name}</option>`).join('')}</select></div>`}
function filteredEpisodes(){const q=search.toLocaleLowerCase('cs');const person=people.find(p=>p[0]===personFilter)?.[1];return episodes.filter(e=>(!q||(e.title+' '+e.hosts).toLocaleLowerCase('cs').includes(q))&&(!person||e.hosts.includes(person)))}
function archiveItems(){const list=filteredEpisodes();return list.length?episodeRows(list,variant==='B'?'studio':'row'):'<p class="empty">Žádný díl neodpovídá filtru. Zkuste jiné téma nebo jméno.</p>'}
function episodesPage(){if(variant==='B')return `<main id="main" class="wrap"><section class="page-intro"><span class="eyebrow">AI ta Krajta / archiv</span><h1 style="margin-top:15px">Otevřete si téma.</h1><p class="lead" style="font-size:14px">Najděte díl podle člověka, modelu nebo otázky, kterou právě řešíte.</p></section><div class="b-archive-layout"><section>${searchControls()}<div id="archive-items">${archiveItems()}</div></section><aside>${rail('Dává vaše téma smysl i nám?')}</aside></div></main>`;if(variant==='C')return `<main id="main" class="wrap"><section class="c-archive-intro"><div><span class="eyebrow">Celá debata na jednom místě</span><h1 style="margin-top:15px">Díly.</h1></div><div class="notice">Máte téma pro společnou debatu?<div style="margin-top:10px">${partnerButton('Partnerství pro firmy','secondary')}</div></div></section>${searchControls()}<div id="archive-items">${archiveItems()}</div></main>`;return `<main id="main" class="wrap a-archive"><section class="page-intro"><span class="eyebrow">Archiv podcastu</span><h1 style="margin-top:15px;font-family:Georgia,serif;font-weight:normal">Každý díl.<br>Jiný pohled na AI.</h1><p class="lead" style="font-size:14px">Modely, nástroje i věci, které se nevejdou do tiskové zprávy.</p></section>${searchControls()}<div id="archive-items">${archiveItems()}</div><div style="margin-top:40px;padding:25px 0;border-top:1px solid var(--line)">${partnerButton('Vaše téma může být příští')}</div></main>`}

A:{subtitle:'Redakční médium: nejdřív důvěra, jasná nabídka hned v prvním záběru.',hats:[['⚪ Bílý · fakta','39 000 Kč měsíčně, nejméně 3 měsíce a původní plnění. Čísla publika mají původní datum.','Doplněna celková minimální cena 117 000 Kč bez DPH.'],['🔴 Červený · dojem','Klidná sazba a skutečné obličeje budují důvěru. Může ale působit méně komerčně.','Partnerství má vlastní zelený pruh před seznamem dílů.'],['⚫ Černý · rizika','Firma by mohla přehlédnout nabídku v podcastovém obsahu. Dlouhý formulář může odradit.','Cena je nad přehybem; poptávka má jen čtyři věcná pole.'],['🟡 Žlutý · přínosy','Obsah dokládá tón pořadu ještě před obchodním rozhovorem. Firemní nabídka je na jeden klik.','Přímé CTA z úvodu na jednu nabídku a kontakt.'],['🟢 Zelený · možnosti','Spojit reputaci redakce s jednoduchou obchodní částí.','Přidána věta o redakční nezávislosti vedle ceny, ostatní formáty do detailů.'],['🔵 Modrý · vyhodnocení','Hypotéza: důvěra zvýší počet relevantních poptávek. Nejde o naměřený výsledek.','Po výběru sledovat návštěva nabídky → odeslaná a kvalifikovaná poptávka → platící partner.']],verdict:'Nejvhodnější, pokud chceme působit především jako důvěryhodné médium. Obchodní nabídka se přesto nesmí ztratit pod obsahem.'},
B:{subtitle:'Studio: posluchači a firemní partneři mají souběžnou, jasně čitelnou cestu.',hats:[['⚪ Bílý · fakta','Stejná cena i plnění jako ve veřejné nabídce, žádné přidané garance.','Reporty po 7 a 30 dnech a minimální celé období jsou explicitní.'],['🔴 Červený · dojem','Působí jako živý pořad s vlastním charakterem. Firemní panel je vidět bez hledání.','Panel používá světlý kontrast a klidnější tón než podcastový obsah.'],['⚫ Černý · rizika','Dva sloupce mohou na mobilu soupeřit. Příliš hustý panel by snižoval čitelnost.','Na mobilu je panel před díly, cena zůstává na jednom řádku a další krok má celou šířku.'],['🟡 Žlutý · přínosy','Nabídka je dostupná i během procházení archivu. Obě skupiny návštěvníků mají přímý další krok.','Trvalé Pro firmy v menu a kontrastní panel v archivu.'],['🟢 Zelený · možnosti','Ukázat spolupráci jako srozumitelný proces místo tří tarifních karet.','Na stránce pro firmy je krátká časová osa: plán → integrace → vyhodnocení.'],['🔵 Modrý · vyhodnocení','Hypotéza: panel přivede více zájemců z archivu bez poškození poslechu.','Porovnat kvalifikované firemní poptávky a platící partnery; hlídat spuštění dílu jako vedlejší metriku.']],verdict:'Doporučený výchozí směr. Udržuje charakter Krajty a zároveň dává dlouhodobému partnerství stabilní, výrazné místo.'},
C:{subtitle:'Obchodní brief: firemní partnerství je hlavní vstup, poslech slouží i jako ukázka.',hats:[['⚪ Bílý · fakta','Žádné změny cen, rozsahu, délky ani redakčních pravidel. Výběr cíle nemění balíček.','Cena je vidět před briefem i v jeho rekapitulaci.'],['🔴 Červený · dojem','Jasná ambice a velmi přímé obchodní sdělení. Část posluchačů může mít pocit reklamního webu.','Hned v prvním záběru zůstává cesta Jdu poslouchat a skutečný díl.'],['⚫ Černý · rizika','Více kroků může skrýt kontakt nebo připomínat závaznou objednávku.','Kroky jsou přímo přístupné, e-mail se ptá až nakonec a brief je výslovně nezávazný.'],['🟡 Žlutý · přínosy','Zájemce se sám pojmenuje cílem; obchodní rozhovor začíná s kontextem.','Čtyři jasné cíle, žádná povinná volba dalších placených doplňků.'],['🟢 Zelený · možnosti','Získat stručnější a lépe strukturované firemní zadání.','Rekapitulace spojuje vybraný cíl, minimální období a cenu ještě před kontaktem.'],['🔵 Modrý · vyhodnocení','Hypotéza: méně, ale konkrétnějších poptávek a vyšší podíl platících partnerů.','Měřit dokončení kroků, kvalifikaci a uzavřená partnerství; zároveň sledovat, zda neutrpí poslech.']],verdict:'Nejodvážnější obchodní varianta. Silná pro návštěvy z přímého oslovení firem, pro běžnou homepage vyžaduje nejvíc ověření s posluchači.'}
};
function renderSwitcher(){document.querySelector('#prototype-switcher').innerHTML=`<button class="switch-arrow" data-cycle="-1" aria-label="Předchozí varianta">←</button><div class="switch-label"><strong>${variant} · ${variantNames[variant]}</strong><small>PROTOTYP · ${pageNames[page]}</small></div><button class="switch-arrow" data-cycle="1" aria-label="Další varianta">→</button><span class="switch-divider"></span>${['A','B','C'].map(v=>`<button data-variant="${v}" aria-label="Varianta ${v}: ${variantNames[v]}" aria-pressed="${variant===v}">${v}</button>`).join('')}<span class="switch-divider"></span><button class="review-button" data-review>6 klobouků</button>`}
function render(){document.body.className='variant-'+variant;document.title=`${variant} · ${variantNames[variant]} — ${pageNames[page]} | AI ta Krajta`;document.querySelector('#app').innerHTML=header()+(page==='episodes'?episodesPage():page==='partners'?({A:partnersA,B:partnersB,C:partnersC}[variant]()) :({A:homeA,B:homeB,C:homeC}[variant]()))+footer();renderSwitcher();document.querySelector('#status-live').textContent=`Varianta ${variant}: ${variantNames[variant]}. Stránka ${pageNames[page]}.`}
function saveBrief(){const topic=document.querySelector('#brief-topic');if(topic)briefTopic=topic.value;const form=document.querySelector('#brief-content form');if(form)briefContact=Object.fromEntries(new FormData(form).entries())}
function navigate(nextPage,nextVariant=variant,anchor=''){saveBrief();page=nextPage;variant=nextVariant;history.pushState({},'',href()+ (anchor?'#'+anchor:''));render();if(anchor){const target=document.getElementById(anchor);if(target?.tagName==='DETAILS')target.open=true;target?.scrollIntoView({behavior:'smooth'})}else window.scrollTo(0,0)}
function cycle(direction){const keys=['A','B','C'];navigate(page,keys[(keys.indexOf(variant)+direction+3)%3])}
function showReview(){const review=reviews[variant];document.querySelector('#review-content').innerHTML=`<div class="review-head"><div><span class="eyebrow">Seberevize a zapracované změny</span><h2 style="margin-top:12px">${variant} · ${variantNames[variant]}</h2><p>${review.subtitle}</p></div><button class="close-review" aria-label="Zavřít hodnocení" data-close-review>×</button></div><div class="hat-grid">${review.hats.map(([hat,critique,change])=>`<section class="hat"><span class="eyebrow">${hat}</span><p>${critique}</p><p class="change">Zapracováno: ${change}</p></section>`).join('')}</div><div class="verdict"><strong>Závěr pro získání platících partnerů</strong>${review.verdict}<p style="font-size:11px;color:#6b776c;margin-top:15px">Cíl: kvalifikované poptávky a uzavřená tříměsíční partnerství. Prototypy nejsou konverzní experiment a uvedené předpoklady nejsou naměřené výsledky.</p></div>`;document.querySelector('#review').showModal()}
function play(){const audio=document.querySelector('audio');if(!audio.src)audio.src=audioUrl;document.querySelector('#audio-player').hidden=false;audio.play().catch(()=>{toast('Nahrávka je připravená. Spusťte ji tlačítkem přehrávače.');})}
let toastTimer;function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200)}
document.addEventListener('click',event=>{const el=event.target.closest('a,button');if(!el)return;if(el.dataset.page){event.preventDefault();navigate(el.dataset.page,variant,el.dataset.anchor||'')}else if(el.dataset.variant){navigate(page,el.dataset.variant)}else if(el.dataset.cycle){cycle(Number(el.dataset.cycle))}else if(el.hasAttribute('data-review')){showReview()}else if(el.hasAttribute('data-close-review')){document.querySelector('#review').close()}else if(el.dataset.play){play()}else if(el.dataset.person){personFilter=el.dataset.person;search='';navigate('episodes')}else if(el.hasAttribute('data-contact')){event.preventDefault();document.querySelector('#kontakt')?.scrollIntoView({behavior:'smooth'});setTimeout(()=>document.querySelector('#kontakt input,#kontakt button')?.focus({preventScroll:true}),200)}else if(el.dataset.goal){briefGoal=el.dataset.goal;document.querySelector('#brief-content').innerHTML=brief()}else if(el.hasAttribute('data-brief-next')){saveBrief();briefStep=Math.min(2,briefStep+1);document.querySelector('#brief-content').innerHTML=brief()}else if(el.hasAttribute('data-brief-back')){saveBrief();briefStep=Math.max(0,briefStep-1);document.querySelector('#brief-content').innerHTML=brief()}else if(el.hasAttribute('data-brief-step')){saveBrief();briefStep=Number(el.dataset.briefStep);document.querySelector('#brief-content').innerHTML=brief()}});
document.addEventListener('submit',event=>{if(!event.target.matches('.partner-form'))return;event.preventDefault();event.target.querySelector('.form-result').textContent='Ukázka dokončena. Tento prototyp žádné údaje neukládá ani neodesílá.';toast('Prototyp: formulář funguje jako ukázka, zpráva se neodesílá.');});
document.addEventListener('input',event=>{if(event.target.id==='archive-search'){search=event.target.value;document.querySelector('#archive-items').innerHTML=archiveItems()}if(event.target.id==='brief-topic')briefTopic=event.target.value});
document.addEventListener('change',event=>{if(event.target.id==='person-filter'){personFilter=event.target.value;document.querySelector('#archive-items').innerHTML=archiveItems()}});
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,select,[contenteditable="true"]')||document.querySelector('#review').open)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1)}});
document.querySelector('#close-player').addEventListener('click',()=>{document.querySelector('audio').pause();document.querySelector('#audio-player').hidden=true});
document.querySelector('#review').addEventListener('click',event=>{if(event.target===event.currentTarget)event.currentTarget.close()});
window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);variant=['A','B','C'].includes(p.get('variant'))?p.get('variant'):'A';page=['home','episodes','partners'].includes(p.get('page'))?p.get('page'):'home';render()});
render();
</script>
</body></html>
