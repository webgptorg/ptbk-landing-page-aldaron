name: 🧪 Checks

on:
    push:
        branches: main

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: 🔽 Checkout
              uses: actions/checkout@v4

            - name: 🔽 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: 🔽 Install dependencies
              run: npm ci

            - name: 🧪 Test lint
              run: npm run lint

            - name: 🧪 Test types
              run: npm run test-types

            - name: 🏭 Build
              run: npm run build
              env:
                  NEXT_PUBLIC_SKIP_WAITLIST_TOKEN: ${{ secrets.NEXT_PUBLIC_SKIP_WAITLIST_TOKEN }}
                  # DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  # <- Note: This is only needed to successfully run the build
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY}}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            - name: 🧪 Check build output
              run: |
                  node --input-type=module <<'NODE'
                  import { existsSync, readFileSync } from 'node:fs';
                  if (!existsSync('.next/BUILD_ID')) throw new Error('Next.js production build is missing.');
                  const { routes } = JSON.parse(readFileSync('.next/prerender-manifest.json', 'utf8'));
                  const feeds = [
                      '/cs/articles/podcast.xml', '/en/articles/podcast.xml',
                      '/cs/pavol/articles/podcast.xml', '/en/pavol/articles/podcast.xml',
                  ];
                  for (const feed of feeds) {
                      if (!routes[feed]) throw new Error(`Podcast feed is not a static build output: ${feed}`);
                  }
                  console.log('Next.js production build and all four static podcast feeds are present.');
                  NODE
