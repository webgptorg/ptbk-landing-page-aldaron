name: Import reviewed article audio

on:
    workflow_dispatch:
        inputs:
            article_id:
                description: Committed article variant with a reviewed audio/import.json
                required: true
                default: spec-driven-anchoring-cs
                type: string

permissions:
    contents: write

concurrency:
    group: article-audio-import
    cancel-in-progress: false

jobs:
    import:
        if: github.ref == 'refs/heads/main' && github.repository == 'webgptorg/ptbk-landing-page-aldaron'
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Import the already generated recording
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  ARTICLE_ID: ${{ inputs.article_id }}
              run: node scripts/articles/import-audio-blobs.mjs "$ARTICLE_ID"
            - name: Commit the verified MP3
              env:
                  ARTICLE_ID: ${{ inputs.article_id }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add -- "articles/$ARTICLE_ID/audio/narration.mp3"
                  if git diff --cached --quiet; then
                      echo 'The reviewed MP3 is already committed.'
                      exit 0
                  fi
                  git commit -m "feat(articles): publish reviewed Czech narration"
                  git push origin HEAD:main
